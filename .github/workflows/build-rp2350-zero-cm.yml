name: build-rp2350-zero-cm

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'firmware/**'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-rp2350-zero-cm.yml'

permissions:
  contents: read

concurrency:
  group: build-rp2350-zero-cm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Waveshare RP2350-Zero-CM (Yubikey5)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: build firmware with nix
        run: |
          nix build --impure --expr \
            '(builtins.getFlake (toString ./.)).lib.${builtins.currentSystem}.mkFirmware {
               name = "rs-key-rp2350-zero-cm-yubikey5";
               flashSize = "2M";
               kvmain = "896K";
               vidpid = "Yubikey5";
             }'
          mkdir -p dist
          cp result/*.uf2 dist/
          cp result/*.elf dist/
          ls -lh dist/
          sha256sum dist/*

      - name: upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rs-key-rp2350-zero-cm-yubikey5
          path: dist/
